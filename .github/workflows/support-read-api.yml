name: Support read API verification
on:
  push:
    branches: [codex/support-read-api-20261102]
  pull_request:
    paths:
      - src/lib/mcp/**
      - supabase/migrations/20261102020000_support_read_api.sql
      - supabase/tests/support_read_api.sql
      - scripts/test-support-read-sql.mjs
      - vitest.support-api.config.ts
      - .github/workflows/support-read-api.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stock application types
        run: npm run typecheck
      - name: Support and existing MCP regressions
        run: node node_modules/vitest/vitest.mjs run --config vitest.support-api.config.ts
      - name: Isolated PostgreSQL support read checks
        run: node scripts/test-support-read-sql.mjs
      - name: Build application and generated MCP
        run: npm run build
      - name: Extract OAuth tool catalogue
        run: npm run mcp:manifest
      - name: Preserve exact deployment source
        run: |
          mkdir -p outputs/support-api
          git rev-parse HEAD > outputs/support-api/head.txt
          cp supabase/functions/mcp/index.ts outputs/support-api/mcp-index.ts
          cp .lovable/mcp/manifest.json outputs/support-api/mcp-manifest.json
          sha256sum outputs/support-api/* > outputs/support-api/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: support-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/support-api/
          if-no-files-found: error
          retention-days: 14

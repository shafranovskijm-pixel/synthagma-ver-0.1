name: Support events worker source verification
on:
  push:
    branches: [codex/support-events-worker-ci-20261103]
permissions:
  contents: read
jobs:
  worker-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Worker 62 unit cases, no TSX dependency
        run: |
          mkdir -p outputs/support-events-worker
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec supabase/functions/_shared/support-mcp-events/webhook-security.test.ts supabase/functions/_shared/support-mcp-events/worker-http.test.ts | tee outputs/support-events-worker/tests.log
          grep -Eq 'tests 62$' outputs/support-events-worker/tests.log
          grep -Eq 'pass 62$' outputs/support-events-worker/tests.log
          grep -Eq 'fail 0$' outputs/support-events-worker/tests.log
      - name: Strict worker/shared source types
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --allowImportingTsExtensions --types node --lib ES2022,DOM
          supabase/functions/_shared/support-mcp-events/crypto.ts
          supabase/functions/_shared/support-mcp-events/pinned-https.ts
          supabase/functions/_shared/support-mcp-events/webhooks.ts
          supabase/functions/_shared/support-mcp-events/delivery.ts
          supabase/functions/_shared/support-mcp-events/worker-http.ts
          supabase/functions/_shared/support-mcp-events/webhook-security.test.ts
          supabase/functions/_shared/support-mcp-events/worker-http.test.ts
      - name: Neutral Edge bundle graph, no Deno acceptance
        run: node scripts/check-support-events-worker-source.mjs
      - name: Stock application types
        run: npm run typecheck
      - name: Stock application build without MCP wrapper
        run: npm run build
      - name: Existing MCP handler and UI build config unchanged
        run: git diff --exit-code -- src/lib/mcp supabase/functions/mcp/index.ts vite.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: support-events-worker-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/support-events-worker/
          if-no-files-found: error
          retention-days: 14

name: Managed Rostekhnadzor training
on:
  pull_request:
    paths:
      - supabase/migrations/*rtn*.sql
      - supabase/tests/rtn-managed/**
      - supabase/tests/rtn-quota/**
      - supabase/tests/rtn-drafts/**
      - supabase/tests/rtn-account-erasure/**
      - supabase/tests/rtn-freshness/**
      - scripts/test-rtn*.py
      - .github/workflows/rtn-managed.yml
      - src/api/rostechnadzor*
      - src/api/rtn-editorial*
      - src/types/rostechnadzor.ts
      - src/components/organization/rtn/**
      - src/components/student/rtn/**
      - src/components/organization/tabs/CoursesTab.tsx
      - src/pages/StudentDashboard.tsx
      - supabase/functions/_shared/rtn/**
      - supabase/functions/rtn-source-check/**
      - supabase/functions/rtn-source-cron/**
      - supabase/functions/_shared/cron-auth.ts
      - supabase/config.toml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Workspace learner editorial and official-source regressions
        run: node node_modules/vitest/vitest.mjs run src/api/rostechnadzor.test.ts src/components/organization/rtn src/components/student/rtn supabase/functions/_shared/rtn --maxWorkers=1
      - run: npm run build
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.1.4'
      - name: Edge runtime types and bounded native decompression
        run: |
          deno check --config supabase/functions/rtn-source-check/deno.json --no-lock supabase/functions/rtn-source-check/index.ts
          deno check --config supabase/functions/rtn-source-cron/deno.json --no-lock supabase/functions/rtn-source-cron/index.ts
          deno eval 'new DecompressionStream("deflate-raw");'
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: rtn_lab_ci
          POSTGRES_USER: lab_bootstrap
          POSTGRES_PASSWORD: synthetic_rtn_fixture_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab_bootstrap -d rtn_lab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: rtn_lab_ci
      PGUSER: lab_bootstrap
      PGPASSWORD: synthetic_rtn_fixture_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Native PG17 permissions versions source checks and concurrency
        run: python scripts/test-rtn-sql.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rtn-managed-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/rtn-managed-native/
          if-no-files-found: error
          retention-days: 14
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: rtn_quota_lab_ci
          POSTGRES_USER: lab_bootstrap
          POSTGRES_PASSWORD: synthetic_rtn_quota_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab_bootstrap -d rtn_quota_lab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: rtn_quota_lab_ci
      PGUSER: lab_bootstrap
      PGPASSWORD: synthetic_rtn_quota_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exact old trigger parity mixed normal RTN quota races and anonymous counter retention
        run: python scripts/test-rtn-quota-sql.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rtn-quota-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/rtn-quota-native/
          if-no-files-found: error
          retention-days: 14
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: rtn_lab_ci
          POSTGRES_USER: lab_bootstrap
          POSTGRES_PASSWORD: synthetic_rtn_drafts_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab_bootstrap -d rtn_lab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: rtn_lab_ci
      PGUSER: lab_bootstrap
      PGPASSWORD: synthetic_rtn_drafts_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Native partial answers two-device CAS and immutable final submission
        run: python scripts/test-rtn-drafts-sql.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rtn-drafts-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/rtn-drafts-native/
          if-no-files-found: error
          retention-days: 14
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: rtn_erasure_lab_ci
          POSTGRES_USER: lab_bootstrap

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: rtn_erasure_lab_ci
      PGUSER: lab_bootstrap
      PGPASSWORD: synthetic_rtn_erasure_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Actual captured erasure workflow narrow RTN cleanup and rollback
        run: python supabase/tests/rtn-account-erasure/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()

name: Pinned AS004 programme version 90-case regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pinned-frontend-candidates.yml'
      - '.ci/frontend-candidates/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  frontend:
    name: '${{ matrix.variant }} / stock TSC + actual cases'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [autoschool-entry]
    steps:
      - name: Read CI-only checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-27
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Pinned Linux Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-27
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the repository's exact npm version
        run: npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
      - name: Install only the unchanged lockfile
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund
      - name: Verify exact source and run offline hook/component cases
        run: node scripts/ci/run-frontend-candidate.mjs '${{ matrix.variant }}'
      - name: Preserve exact counts, source pins, and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node24
        with:
          name: 'frontend-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '.ci-artifacts/${{ matrix.variant }}/'
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

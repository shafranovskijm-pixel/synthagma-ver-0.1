name: Postpaid billing API verification

on:
  push:
    branches: [codex/billing-api-20261102]
  pull_request:
    paths:
      - src/lib/mcp/**
      - supabase/migrations/20261102010000_postpaid_billing_api_checked.sql
      - supabase/tests/postpaid_billing_api/**
      - vitest.postpaid-api.config.ts
      - .github/workflows/postpaid-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record reviewed source and runtime
        run: |
          mkdir -p outputs/postpaid-api
          git rev-parse HEAD > outputs/postpaid-api/head.txt
          node --version > outputs/postpaid-api/node.txt
          git ls-files src/lib/mcp supabase/migrations/20261102010000_postpaid_billing_api_checked.sql supabase/tests/postpaid_billing_api vitest.postpaid-api.config.ts .github/workflows/postpaid-api.yml | xargs sha256sum > outputs/postpaid-api/source-manifest.sha256
      - name: Check stock application types
        run: npm run typecheck 2>&1 | tee outputs/postpaid-api/typecheck.txt
      - name: Billing, invoice, act and caller-identity regressions
        run: node node_modules/vitest/vitest.mjs run --config vitest.postpaid-api.config.ts --reporter=json --outputFile=outputs/postpaid-api/tests.json 2>&1 | tee outputs/postpaid-api/tests.txt
      - name: Build application and generated OAuth MCP bundle
        run: npm run build 2>&1 | tee outputs/postpaid-api/build.txt
      - name: Extract the current OAuth tool catalogue
        run: npm run mcp:manifest 2>&1 | tee outputs/postpaid-api/manifest.txt
      - name: Preserve generated MCP deployment source
        run: |
          mkdir -p outputs/postpaid-api/generated
          cp supabase/functions/mcp/index.ts outputs/postpaid-api/generated/mcp-index.ts
          cp .lovable/mcp/manifest.json outputs/postpaid-api/generated/mcp-manifest.json
          sha256sum outputs/postpaid-api/generated/* > outputs/postpaid-api/generated-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: postpaid-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/postpaid-api/
          if-no-files-found: error
          retention-days: 14

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: postpaid_api_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_postpaid_api_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postpaid_api_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postpaid_api_lab
      PGUSER: postgres
      PGPASSWORD: synthetic_postpaid_api_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test client
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple "psycopg[binary]==3.2.9"
      - name: Exercise checked native financial transactions
        run: python supabase/tests/postpaid_billing_api/run-native-lab.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: postpaid-api-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/postpaid-api-native/
          if-no-files-found: error
          retention-days: 14

name: Media library response size and access
on:
  pull_request:
    paths:
      - src/components/course-builder/MediaLibraryDialog.tsx
      - src/components/course-builder/PptxPickerDialog.tsx
      - src/components/course-builder/__tests__/MediaLibraryDialog.staff.test.tsx
      - src/components/course-builder/__tests__/PptxPickerDialog.egress.test.tsx
      - src/integrations/supabase/types.ts
      - supabase/migrations/20261118090000_media_library_usage_metadata.sql
      - supabase/migrations/20261118091000_slider_lesson_metadata.sql
      - tests/media-egress/**
      - .github/workflows/media-library-egress.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Media library and presentation interaction regressions
        run: node node_modules/vitest/vitest.mjs run src/components/course-builder/__tests__/MediaLibraryDialog.staff.test.tsx src/components/course-builder/__tests__/PptxPickerDialog.egress.test.tsx --maxWorkers=1
      - name: Actual SQL, caller RLS, and bounded response regressions
        run: node tests/media-egress/sql.node-test.mjs
      - run: npm run build

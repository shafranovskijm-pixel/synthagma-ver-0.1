name: Learning progress reset native PostgreSQL 17

on:
  push:
    branches: [codex/learning-progress-reset-20261029]
  pull_request:
    paths:
      - .github/workflows/learning-progress-reset-native.yml
      - supabase/migrations/20261030000000_learning_progress_reset_epoch.sql
      - supabase/tests/learning_progress_reset/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-progress-reset-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: lpr_reset_lab_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_lpr_lab_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lpr_reset_lab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: lpr_reset_lab_ci
      PGUSER: postgres
      PGPASSWORD: synthetic_lpr_lab_only
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # official v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # official v7
        with:
          python-version: "3.12"
      - name: Install isolated test dependency from official PyPI
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple "psycopg[binary]==3.2.9"
      - name: Run 90 serial assertions and five native lock-barrier races
        run: >-
          python supabase/tests/learning_progress_reset/run-native-lab.py
          --expected-migration-sha 9c7e2ce70a42f739614f2f5b84828ab4f930aba5a53c5fd3a1f16a36f76db48b
      - name: Upload native proof and exact source manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # official v7
        with:
          name: learning-progress-reset-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/learning-progress-reset-native/
          if-no-files-found: error
          retention-days: 14


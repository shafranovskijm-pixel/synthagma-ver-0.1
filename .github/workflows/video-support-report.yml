name: Video error support report
on:
  push:
    branches: [codex/video-error-support-20261105]
  pull_request:
    paths:
      - public/video-check.html
      - vite.config.ts
      - src/components/video/**
      - src/hooks/useCourseFileDeliveryMode.ts
      - src/hooks/__tests__/useCourseFileDeliveryMode.test.tsx
      - src/components/course-preview/__tests__/CoursePreviewView.file-delivery.test.tsx
      - src/components/course-learning/VideoPlayerInline.tsx
      - src/components/course-learning/VideoProblemReportButton.tsx
      - src/components/course-learning/__tests__/Video*test.tsx
      - src/lib/support/**
      - src/components/admin/SupportRequestScreenshot.tsx
      - src/components/admin/SupportRequestsManager.tsx
      - src/components/admin/__tests__/SupportRequestScreenshot.test.tsx
      - .github/workflows/video-support-report.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Video, privacy, retry, navigation, and existing notification regressions
        run: node node_modules/vitest/vitest.mjs run src/lib/support src/components/admin/__tests__/SupportRequestScreenshot.test.tsx src/components/course-learning/__tests__/VideoProblemReportButton.test.tsx src/components/course-learning/__tests__/VideoPlayerInline.video-report.test.tsx src/components/course-learning/__tests__/VideoPlayerInline.test.tsx src/components/video/__tests__/CourseVideoPlayer.test.tsx src/components/video/__tests__/kinescopeAutoRecovery.test.ts src/hooks/__tests__/useCourseFileDeliveryMode.test.tsx src/components/course-preview/__tests__/CoursePreviewView.file-delivery.test.tsx src/security/__tests__/TelegramDomainEndpointSecurity.test.ts --maxWorkers=1
      - run: npm run build

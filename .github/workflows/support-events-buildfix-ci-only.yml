name: SDK dependency resolution differential build (CI only)
on:
  push:
    branches: [codex/support-events-sdk-buildfix-ci-20261103]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, bun]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.3
      - name: Fresh locked dependency layout and SDK dependency build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-buildfix-cache
        run: node scripts/check-support-events-buildfix-ci.mjs ${{ matrix.manager }}
      - name: Preserve differential source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-events-buildfix-${{ matrix.manager }}
          path: outputs/support-events-buildfix-${{ matrix.manager }}/
          if-no-files-found: error

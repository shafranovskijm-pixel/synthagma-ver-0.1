name: Support events probe status v3 backend verification
on:
  push:
    branches: [codex/support-events-probe-status-ci-20261103]
permissions:
  contents: read
jobs:
  backend-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backend 92 unit cases sequentially, including unchanged78
        run: |
          mkdir -p outputs/support-events-probe-status-v3
          node --experimental-strip-types --test --test-concurrency=1 --test-reporter=spec supabase/functions/_shared/support-mcp-events/webhook-security.test.ts supabase/functions/_shared/support-mcp-events/worker-http.test.ts supabase/functions/_shared/support-mcp-events/worker-probe-auth-v2.test.ts supabase/functions/_shared/support-mcp-events/worker-probe-status-v3.test.ts | tee outputs/support-events-probe-status-v3/tests.log
          grep -Eq 'tests 92$' outputs/support-events-probe-status-v3/tests.log
          grep -Eq 'pass 92$' outputs/support-events-probe-status-v3/tests.log
          grep -Eq 'fail 0$' outputs/support-events-probe-status-v3/tests.log
      - name: Strict backend and shared types
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --allowImportingTsExtensions --types node --lib ES2023,DOM
          supabase/functions/_shared/support-mcp-events/crypto.ts
          supabase/functions/_shared/support-mcp-events/pinned-https.ts
          supabase/functions/_shared/support-mcp-events/webhooks.ts
          supabase/functions/_shared/support-mcp-events/delivery.ts
          supabase/functions/_shared/support-mcp-events/worker-http.ts
          supabase/functions/_shared/support-mcp-events/webhook-security.test.ts
          supabase/functions/_shared/support-mcp-events/worker-http.test.ts
          supabase/functions/_shared/support-mcp-events/worker-probe-auth-v2.test.ts
          supabase/functions/_shared/support-mcp-events/worker-probe-status-v3.test.ts
      - name: Exact neutral graph and protected application, MCP and SQL git objects
        run: node scripts/check-support-events-probe-status-v3.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: support-events-probe-status-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/support-events-probe-status-v3/
          if-no-files-found: error
          retention-days: 14

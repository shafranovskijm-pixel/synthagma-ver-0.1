    <!-- Cache/SW bootstrap: URL-marker reload in preview, asset-change reload in production -->
    <script>
      (function(){
        var isPreview = location.hostname.indexOf('preview--') !== -1 || location.hostname === 'localhost';

        // Runtime kill-switch: always remove the legacy "Резервный канал" badge.
        // The proxy itself remains enabled on синтагма.рф; only the user-facing badge is removed.
        var HIDE_BADGE_KEY = '__hide_proxy_badge';
        var hideBadge = true;
        try {
          localStorage.setItem(HIDE_BADGE_KEY, 'true');
        } catch (e) {}

        function removeLegacyProxyBadge() {
          if (!hideBadge) hideBadge = true;
          try {
            var nodes = document.querySelectorAll('body *');
            for (var i = 0; i < nodes.length; i += 1) {
              var node = nodes[i];
              var text = node && node.textContent ? node.textContent.trim() : '';
              if (text === 'Резервный канал') {
                var badge = node.closest('[class*="fixed"][class*="bottom-"]') || node.parentElement || node.closest('button,a,div');
                if (badge) badge.remove();
              }
            }
          } catch (e) {}
        }

        if (!isPreview) {
          removeLegacyProxyBadge();
          setInterval(removeLegacyProxyBadge, 250);
          try {
            var badgeObserver = new MutationObserver(removeLegacyProxyBadge);
            if (document.body) badgeObserver.observe(document.body, { childList: true, subtree: true });
            else document.addEventListener('DOMContentLoaded', function(){
              if (document.body) badgeObserver.observe(document.body, { childList: true, subtree: true });
              removeLegacyProxyBadge();
            }, { once: true });
          } catch (e) {}
          window.addEventListener('sintagma:proxy-badge-visibility', function(event) {
            hideBadge = true;
            try { localStorage.setItem(HIDE_BADGE_KEY, 'true'); } catch (e) {}
            removeLegacyProxyBadge();
          });
        }


        function purgeAll() {
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function(regs){
                return Promise.all(regs.map(function(r){ return r.unregister(); }));
              })
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function(names){
                return Promise.all(names.map(function(n){ return caches.delete(n); }));
              })
            );
          }
          return Promise.all(tasks);
        }

        if (isPreview) {
          var guard = '__purge_preview_session';
          if (!sessionStorage.getItem(guard)) {
            sessionStorage.setItem(guard, '1');
            purgeAll().then(function(){ location.reload(); }).catch(function(){ location.reload(); });
          }
        } else {
          // Production: reload on asset change
          var scriptEl = document.querySelector('script[type="module"][src]');
          var assetId = scriptEl ? scriptEl.getAttribute('src') : 'unknown';
          var storedAsset = localStorage.getItem('__asset_id');
          if (storedAsset && storedAsset !== assetId) {
            localStorage.setItem('__asset_id', assetId);
            var guard = '__purge_asset_' + assetId;
            if (!sessionStorage.getItem(guard)) {
              sessionStorage.setItem(guard, '1');
              purgeAll().then(function(){ location.reload(); }).catch(function(){ location.reload(); });
            }
          } else {
            localStorage.setItem('__asset_id', assetId);
          }
        }
      })();
    </script>

    <!-- SW recovery: if app fails to render in 8s, unregister SW and reload -->
    <script>
      (function(){
        var recoveryKey = '__sw_recovery_attempted';
        var t = setTimeout(function(){
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && 'serviceWorker' in navigator) {
            if (sessionStorage.getItem(recoveryKey)) return;
            sessionStorage.setItem(recoveryKey, '1');
            navigator.serviceWorker.getRegistrations().then(function(regs){
              var p = regs.map(function(r){ return r.unregister(); });
              Promise.all(p).then(function(){
                if (typeof caches !== 'undefined') {
                  caches.keys().then(function(names){
                    Promise.all(names.map(function(n){ return caches.delete(n); }))
                      .then(function(){ window.location.reload(); });
                  });
                } else {
                  window.location.reload();
                }
              });
            });
          }
        }, 8000);
        window.__swRecoveryTimer = t;
        var observer = new MutationObserver(function(){
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearTimeout(t);
            observer.disconnect();
          }
        });
        var root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true });
      })();
    </script>

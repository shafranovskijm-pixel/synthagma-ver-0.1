    <!-- Cache/SW bootstrap: URL-marker reload in preview, asset-change reload in production -->
    <script>
      (function(){
        var isPreview = location.hostname.indexOf('preview--') !== -1 || location.hostname === 'localhost';

        // Runtime kill-switch: hide legacy "Резервный канал" badge based on app_settings.hide_proxy_badge.
        // Cached locally for instant apply; async-refreshed from Supabase every load.
        var HIDE_BADGE_KEY = '__hide_proxy_badge';
        var hideBadge = localStorage.getItem(HIDE_BADGE_KEY) !== 'false'; // default: hide

        function removeLegacyProxyBadge() {
          if (!hideBadge) return;
          try {
            var nodes = document.querySelectorAll('body *');
            for (var i = 0; i < nodes.length; i += 1) {
              var node = nodes[i];
              if (node && node.textContent && node.textContent.trim() === 'Резервный канал') {
                var badge = node.closest('[class*="fixed"][class*="bottom-"]') || node.closest('button,a,div');
                if (badge) badge.remove();
              }
            }
          } catch (e) {}
        }

        if (!isPreview) {
          setInterval(removeLegacyProxyBadge, 1000);
          // Async refresh flag from Supabase (anon SELECT allowed for this single key)
          try {
            var SB_URL = 'https://atxwvjxbqjgkbjlhsdch.supabase.co';
            var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0eHd2anhicWpna2JqbGhzZGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwODM5MjcsImV4cCI6MjA4MzY1OTkyN30.5mIZX4EYVPbQbCbHWww8ROD5taCQ51o5qNHOMcKK_s4';
            fetch(SB_URL + '/rest/v1/app_settings?setting_key=eq.hide_proxy_badge&select=setting_value', {
              headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
            }).then(function(r){ return r.ok ? r.json() : null; }).then(function(rows){
              if (!rows || !rows.length) return;
              var v = rows[0] && rows[0].setting_value && rows[0].setting_value.value;
              var next = v !== false; // treat anything except explicit false as "hide"
              localStorage.setItem(HIDE_BADGE_KEY, next ? 'true' : 'false');
              hideBadge = next;
            }).catch(function(){});
          } catch (e) {}
        }


        function purgeAll() {
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function(regs){
                return Promise.all(regs.map(function(r){ return r.unregister(); }));
              })
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function(names){
                return Promise.all(names.map(function(n){ return caches.delete(n); }));
              })
            );
          }
          return Promise.all(tasks);
        }

        if (isPreview) {
          var guard = '__purge_preview_session';
          if (!sessionStorage.getItem(guard)) {
            sessionStorage.setItem(guard, '1');
            purgeAll().then(function(){ location.reload(); }).catch(function(){ location.reload(); });
          }
        } else {
          // Production: reload on asset change
          var scriptEl = document.querySelector('script[type="module"][src]');
          var assetId = scriptEl ? scriptEl.getAttribute('src') : 'unknown';
          var storedAsset = localStorage.getItem('__asset_id');
          if (storedAsset && storedAsset !== assetId) {
            localStorage.setItem('__asset_id', assetId);
            var guard = '__purge_asset_' + assetId;
            if (!sessionStorage.getItem(guard)) {
              sessionStorage.setItem(guard, '1');
              purgeAll().then(function(){ location.reload(); }).catch(function(){ location.reload(); });
            }
          } else {
            localStorage.setItem('__asset_id', assetId);
          }
        }
      })();
    </script>

    <!-- SW recovery: if app fails to render in 8s, unregister SW and reload -->
    <script>
      (function(){
        var recoveryKey = '__sw_recovery_attempted';
        var t = setTimeout(function(){
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && 'serviceWorker' in navigator) {
            if (sessionStorage.getItem(recoveryKey)) return;
            sessionStorage.setItem(recoveryKey, '1');
            navigator.serviceWorker.getRegistrations().then(function(regs){
              var p = regs.map(function(r){ return r.unregister(); });
              Promise.all(p).then(function(){
                if (typeof caches !== 'undefined') {
                  caches.keys().then(function(names){
                    Promise.all(names.map(function(n){ return caches.delete(n); }))
                      .then(function(){ window.location.reload(); });
                  });
                } else {
                  window.location.reload();
                }
              });
            });
          }
        }, 8000);
        window.__swRecoveryTimer = t;
        var observer = new MutationObserver(function(){
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearTimeout(t);
            observer.disconnect();
          }
        });
        var root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true });
      })();
    </script>
